<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons (use the square favicon files, NOT the wide logo) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />

    <!-- SEO basics -->
    <title>Renovation Deco | Rénovation intérieure en France</title>
    <meta
      name="description"
      content="Renovation Deco : rénovation intérieure en France — cuisine, salle de bain, salon, peinture, sols et transformation complète."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://renovation-deco.com/" />

    <!-- Geo / language -->
    <meta name="geo.region" content="FR" />
    <meta name="geo.country" content="France" />
    <meta http-equiv="content-language" content="fr" />
    <link rel="alternate" hreflang="fr" href="https://renovation-deco.com/" />

    <!-- OpenGraph (keep the full logo for sharing previews) -->
    <meta property="og:title" content="Renovation Deco" />
    <meta
      property="og:description"
      content="Rénovation intérieure en France — cuisine, salle de bain, salon, peinture, sols."
    />
    <meta property="og:url" content="https://renovation-deco.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://renovation-deco.com/logo4.png" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://renovation-deco.com/logo4.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HomeAndConstructionBusiness",
        "name": "Renovation Deco",
        "url": "https://renovation-deco.com/",
        "areaServed": "FR",
        "description": "Rénovation intérieure en France : cuisine, salle de bain, salon, peinture, sols.",
        "image": "https://renovation-deco.com/logo4.png"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
